<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DS4400 · Study Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="seg" role="tablist" aria-label="View">
        <button class="seg-btn on" data-view="chat" role="tab" aria-selected="true">Chat</button>
        <button class="seg-btn" data-view="graph" role="tab" aria-selected="false">Graph</button>
      </div>
      <button id="new-chat" class="side-action">+ New chat</button>
      <div class="side-label">Upcoming</div>
      <div id="upcoming"></div>
      <div class="side-label">Recent concepts</div>
      <div id="recents"></div>
    </aside>
    <main id="main">
      <header id="topbar">
        <div><span class="ttl">DS4400 · Machine Learning</span><span class="chip">Summer 2026</span></div>
      </header>
      <section id="view-chat" class="view">
        <div id="messages"></div>
        <form id="composer">
          <input id="q" autocomplete="off" placeholder="Ask anything about DS4400…" aria-label="Ask a question">
          <button id="send" aria-label="Send">↑</button>
        </form>
      </section>
      <section id="view-graph" class="view hidden">
        <div id="graph"></div>
        <aside id="concept-panel" class="hidden"></aside>
      </section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/force-graph@1.43/dist/force-graph.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
