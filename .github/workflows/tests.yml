name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is here because it is the one platform whose default text
        # encoding is NOT utf-8. 26 of this repo's own notes contain characters
        # cp1252 cannot encode, so a missing encoding= argument fails there and
        # nowhere else. A static test guards it, but only a real Windows run
        # proves the claim.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        exclude:
          - os: windows-latest        # one Windows job is enough to catch encoding
            python-version: "3.10"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # Install exactly what users install. This used to be a hand-picked
        # subset, to avoid pulling ~2GB of torch into CI, and it broke twice
        # because the list drifted whenever a dependency changed (first mcp,
        # then numpy). Dropping torch got the full install down to ~170MB, so
        # the subset has no reason to exist and neither does the drift.
        run: pip install -r requirements.txt

      - name: Syntax-check every module
        run: python -m compileall -q .

      - name: PowerShell scripts parse
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($f in @("setup.ps1", "tools/install-daily-sync.ps1")) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $f), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { Write-Error "$f : $($errors | Out-String)"; exit 1 }
            Write-Host "$f parses"
          }

      - name: Run tests
        # Tests needing a built vault or live Canvas credentials skip themselves.
        run: pytest -q
